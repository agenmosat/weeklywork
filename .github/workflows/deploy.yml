name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🚀 Sync to Hosting via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔐 Generate db.php from Secrets
        run: |
          cat > db.php <<'PHP'
          <?php
          mysqli_report(MYSQLI_REPORT_OFF);

          const DB_HOST = '${{ secrets.DB_HOST }}';
          const DB_USER = '${{ secrets.DB_USER }}';
          const DB_PASS = '${{ secrets.DB_PASS }}';
          const DB_NAME = '${{ secrets.DB_NAME }}';

          $koneksi = mysqli_connect(DB_HOST, DB_USER, DB_PASS, DB_NAME);

          if (!$koneksi) {
              die('koneksi database gagal: ' . mysqli_connect_error());
          }
          PHP

      - name: 📤 Upload Files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          dangerous-clean-slate: true
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            ignore/**
            cookies.txt
            db.example.php
            *.sql
            preview.sh
            package.json
            package-lock.json
            node_modules/**
            README.md
            readme.md
            instruction.md
            public/**
